<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'none'">
  <title>Alignment · display lab</title>
  <link rel="stylesheet" href="style.css?v=1.4.5">
  <link rel="stylesheet" href="editor.css">
  <link rel="stylesheet" href="lab.css">
</head>
<body>
  <main id="desktop">
    <div id="stack" role="region" aria-label="Alignment game">
      <div id="story-clock" hidden role="timer" aria-label="Game date and time"><span id="story-date"></span><span id="story-time"></span></div>
      <canvas id="card" aria-hidden="true"></canvas>
      <div id="controls" aria-label="Card controls"></div>
    </div>
    <p id="narration" class="sr-only" aria-live="polite" aria-atomic="true"></p>
    <p id="boot" role="status">…</p>
  </main>
  <dialog id="settings" aria-labelledby="settings-title">
    <h1 id="settings-title">settings</h1>
    <label><input id="sound" type="checkbox"> sound</label>
    <label><input id="motion" type="checkbox"> reduce motion</label>
    <button id="restart">restart intro</button>
    <form method="dialog"><button class="primary">return</button></form>
  </dialog>
  <span id="save-status" class="sr-only" role="status"></span>
  <script type="module" src="app.mjs?v=1.4.5"></script>
</body>
</html>
